services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-code-search-db
    environment:
      POSTGRES_DB: codesearch
      POSTGRES_USER: codesearch
      POSTGRES_PASSWORD: codesearch
    # No host port mapping — only accessible via Docker network.
    # Uncomment for local debugging: ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesearch -d codesearch"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - codesearch

  ollama:
    image: ollama/ollama
    container_name: mcp-code-search-ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codesearch
    profiles:
      - ollama

  mcp-server:
    build: .
    image: mcp-code-search:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MCP_CS_PG_HOST: postgres
      MCP_CS_PG_PORT: "5432"
    stdin_open: true
    networks:
      - codesearch
    profiles:
      - build-only

volumes:
  pgdata:
    name: mcp-codesearch-pgdata
  ollama_data:
    name: mcp-codesearch-ollama-data

networks:
  codesearch:
    name: codesearch
    driver: bridge
