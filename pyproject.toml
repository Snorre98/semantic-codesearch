[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-code-search"
version = "0.1.0"
description = "MCP server for semantic code search using pgvector and Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "ollama>=0.4",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-code-search = "mcp_code_search.server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_code_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
